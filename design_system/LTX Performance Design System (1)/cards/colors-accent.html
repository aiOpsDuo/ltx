<!-- @dsCard group="Colors" viewport="700x160" name="Accent — Verde Neon" subtitle="#BCFFB7 — the one true brand color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 16px; align-items: stretch; height: 120px; }
  .swatch {
    background: var(--ltx-accent);
    color: var(--ltx-text-on-accent);
    width: 220px;
    border-radius: var(--ltx-radius-md);
    padding: 14px 16px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .swatch .name { font-family: var(--ltx-font-mono); font-size: 13px; font-weight: 700; }
  .swatch .hex  { font-family: var(--ltx-font-mono); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .note {
    flex: 1;
    border: 1px solid var(--ltx-border);
    border-radius: var(--ltx-radius-md);
    padding: 14px 18px;
    color: var(--ltx-text-body);
    font-size: 13px;
    line-height: 1.5;
    display: flex; flex-direction: column; justify-content: center;
  }
  .note b { color: var(--ltx-text-title); font-weight: 600; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch">
    <span class="name">VERDE NEON SUAVE</span>
    <span class="hex">#BCFFB7</span>
  </div>
  <div class="note">
    Only on CTAs, headline accents, single-number stats, and brand glyphs.
    <b>Never</b> as a section background or on long body text.
  </div>
</div>
</body>
</html>
