<!-- @dsCard group="Colors" viewport="700x130" name="Brand scale" subtitle="Verde Neon Suave — 50 → 900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 4px; height: 88px; }
  .sw { flex: 1; border-radius: var(--ltx-radius-sm);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 8px; font-family: var(--ltx-font-mono);
    font-size: 10px; font-weight: 700; }
  .s50  { background: #F2FFF0; color: #11161B; }
  .s100 { background: #E3FEDE; color: #11161B; }
  .s200 { background: #BCFFB7; color: #11161B; outline: 2px solid #11161B; outline-offset: 2px; }
  .s300 { background: #92EF8C; color: #11161B; }
  .s500 { background: #62DA5A; color: #11161B; }
  .s700 { background: #33C72A; color: #11161B; }
  .s900 { background: #167012; color: #EDEEF4; }
</style>
</head>
<body>
<div class="row">
  <div class="sw s50">50</div>
  <div class="sw s100">100</div>
  <div class="sw s200">200★</div>
  <div class="sw s300">300</div>
  <div class="sw s500">500</div>
  <div class="sw s700">700</div>
  <div class="sw s900">900</div>
</div>
</body>
</html>
