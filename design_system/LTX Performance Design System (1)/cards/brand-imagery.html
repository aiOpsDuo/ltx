<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; background: #11161B; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .frame { aspect-ratio: 16 / 10; background: #1A1F26; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #282C2B; }
  .frame img { width: 100%; height: 100%; object-fit: cover; opacity: 0.95; }
  .label { font-family: var(--ltx-font-mono); font-size: 10px; color: #A9B5B5; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 8px; }
  .label b { color: #BCFFB7; font-weight: 700; }
</style>
</head>
<body>
<div class="row">
  <div>
    <div class="frame"><img src="../assets/images/sample01.png" alt=""></div>
    <div class="label"><b>do</b> · real photography, natural light</div>
  </div>
  <div>
    <div class="frame"><img src="../assets/images/mountain.png" alt=""></div>
    <div class="label"><b>do</b> · silhouette or cut-out object</div>
  </div>
</div>
</body>
</html>
