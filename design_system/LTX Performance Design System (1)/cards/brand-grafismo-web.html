<!-- @dsCard group="Brand" viewport="1200x620" name="Grafismo — hero web" subtitle="Grafismo animado como textura de fundo em uma hero limpa" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<script src="../assets/graphics/ltx-grafismo.js"></script>
<style>
  html, body { margin: 0; }
  .hero {
    position: relative; width: 1200px; height: 620px; box-sizing: border-box;
    background: #11161B; overflow: hidden;
    display: flex; align-items: center;
    padding: 0 80px;
  }
  /* Full-bleed grafismo texture, denser toward the right */
  .hero > .bg {
    position: absolute; inset: 0; z-index: 0;
    -webkit-mask-image: linear-gradient(90deg, transparent 8%, #000 78%);
    mask-image: linear-gradient(90deg, transparent 8%, #000 78%);
  }
  .col { position: relative; z-index: 1; max-width: 620px; }
  h1 {
    font-family: var(--ltx-font-mono); font-weight: 300; font-size: 52px;
    line-height: 1.1; letter-spacing: -0.02em; color: #EDEEF4;
    margin: 0; max-width: 16ch;
  }
  p.sub {
    font-family: var(--ltx-font-sans); font-weight: 300; font-size: 17px;
    line-height: 1.55; color: #A9B5B5; max-width: 44ch; margin: 24px 0 0;
  }
  .cta { display: flex; gap: 14px; margin-top: 36px; }
  .btn {
    font-family: var(--ltx-font-sans); font-size: 14px; font-weight: 700;
    border-radius: 999px; padding: 13px 26px; cursor: pointer; border: none;
    transition: background 160ms cubic-bezier(0.4,0,0.2,1), color 160ms;
  }
  .btn.primary { background: #BCFFB7; color: #11161B; }
  .btn.primary:hover { background: #92EF8C; }
  .btn.ghost { background: transparent; color: #EDEEF4; border: 1px solid #3B403F; font-weight: 600; }
  .btn.ghost:hover { border-color: #EDEEF4; }
</style>
</head>
<body>
<div class="hero">
  <ltx-grafismo class="bg" variant="01" motion="flow" opacity="0.13" speed="8400"></ltx-grafismo>

  <div class="col">
    <h1>Reduza em 40% o ciclo médio de vendas.</h1>
    <p class="sub">Integramos seus canais de leads e automações direto ao seu CRM em 3 dias. Sua equipe para de preencher planilha e volta a vender.</p>
    <div class="cta">
      <button class="btn primary">Analisar minha operação</button>
      <button class="btn ghost">Como funciona</button>
    </div>
  </div>
</div>
</body>
</html>
