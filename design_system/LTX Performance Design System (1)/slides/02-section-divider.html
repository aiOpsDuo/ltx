<!-- @dsCard group="Slides" viewport="1280x720" name="02 — Section divider" subtitle="Verde Neon Space Mono headline against the canvas" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<script src="../assets/graphics/ltx-grafismo.js"></script>
<style>
  html, body { margin: 0; }
  .slide {
    width: 1280px; height: 720px;
    background: #11161B;
    padding: 96px 128px;
    display: grid;
    grid-template-rows: 1fr auto;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .slide > .grafismo {
    position: absolute; inset: 0; z-index: 0;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 55%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 55%);
  }
  .slide > .stack, .slide > .footer { position: relative; z-index: 1; }
  .stack { display: flex; flex-direction: column; gap: 24px; align-self: center; max-width: 900px; }
  .kicker {
    font-family: var(--ltx-font-mono);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: #A9B5B5;
    text-transform: uppercase;
  }
  h1 {
    font-family: var(--ltx-font-mono);
    font-weight: 700;
    font-size: 80px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #BCFFB7;
    margin: 0;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: end;
    font-family: var(--ltx-font-mono); font-size: 12px;
    color: #696F6D; letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="slide">
  <ltx-grafismo class="grafismo" variant="01" motion="flow" opacity="0.13" speed="7600"></ltx-grafismo>
  <div class="stack">
    <span class="kicker">parte 02</span>
    <h1>onde sua<br>operação perde tempo.</h1>
  </div>
  <div class="footer">
    <span>LTX PERFORMANCE</span>
    <span>02 / 07</span>
  </div>
</div>
</body>
</html>
