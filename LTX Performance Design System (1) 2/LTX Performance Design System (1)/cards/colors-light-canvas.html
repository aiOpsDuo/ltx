<!-- @dsCard group="Colors" viewport="700x130" name="Light canvas" subtitle="Branco · Cinza Gelo · Verde brand-800" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; background: #FFFFFF; }
  .row { display: flex; gap: 12px; height: 88px; }
  .sw {
    flex: 1;
    border-radius: var(--ltx-radius-md);
    padding: 12px 16px;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: var(--ltx-font-mono);
  }
  .sw .n { font-size: 10px; font-weight: 700; opacity: 0.75; letter-spacing: 0.04em; }
  .sw .h { font-size: 18px; font-weight: 700; }
  .paper { background: #FFFFFF; color: #11161B; border: 1px solid #D9DCE3; }
  .elev  { background: #F7F8FA; color: #11161B; border: 1px solid #D9DCE3; }
  .acc   { background: #1F9E17; color: #FFFFFF; }
</style>
</head>
<body>
<div class="row">
  <div class="sw paper"><span class="n">CANVAS</span><span class="h">#FFFFFF</span></div>
  <div class="sw elev"><span class="n">ELEVATED</span><span class="h">#F7F8FA</span></div>
  <div class="sw acc"><span class="n">ACCENT (BRAND-800)</span><span class="h">#1F9E17</span></div>
</div>
</body>
</html>
