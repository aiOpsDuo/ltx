<!-- @dsCard group="Type" viewport="700x200" name="Display — Space Mono" subtitle="Headlines run THIN (400), not bold" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; background: #11161B; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .display { font-family: var(--ltx-font-mono); font-weight: 400; color: #EDEEF4;
    font-size: 48px; line-height: 1.1; letter-spacing: -0.015em; }
  .h1 { font-family: var(--ltx-font-mono); font-weight: 400; color: #EDEEF4;
    font-size: 28px; line-height: 1.2; letter-spacing: -0.01em; }
  .h1 em { font-style: normal; font-weight: 700; color: #BCFFB7; }
  .meta { font-family: var(--ltx-font-mono); font-size: 11px; color: #696F6D; letter-spacing: 0.06em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="stack">
  <div class="display">lógica em movimento.</div>
  <div class="h1">reduza em <em>40%</em> o ciclo de vendas.</div>
  <div class="meta">Space Mono · 400 default · 700 for single-word accents</div>
</div>
</body>
</html>
