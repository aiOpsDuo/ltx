<!-- @dsCard group="Brand" viewport="820x260" name="Motion — durations (live)" subtitle="Fade + 8px translate · 160 / 240 / 480ms in loop" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; background: #11161B; display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; gap: 16px; }
  .cell {
    flex: 1; padding: 18px; border-radius: 12px;
    background: #1A1F26; border: 1px solid #282C2B;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 130px; position: relative; overflow: hidden;
  }
  .name { font-family: var(--ltx-font-mono); font-weight: 400; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #BCFFB7; }
  .val { font-family: var(--ltx-font-mono); font-size: 22px; color: #EDEEF4; font-weight: 400; letter-spacing: -0.01em; }
  .use { font-family: var(--ltx-font-sans); font-size: 12px; font-weight: 300; color: #A9B5B5; }
  .stage { margin-top: auto; height: 28px; position: relative; }
  .chip {
    position: absolute; left: 0; top: 4px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(188,255,183,0.14); color: #BCFFB7;
    font-family: var(--ltx-font-mono); font-size: 11px; font-weight: 400;
    letter-spacing: 0.04em;
    opacity: 0; transform: translateY(8px);
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    animation-iteration-count: infinite;
  }
  .c1 { animation-name: pulse160; animation-duration: 2000ms; }
  .c2 { animation-name: pulse240; animation-duration: 2400ms; }
  .c3 { animation-name: pulse480; animation-duration: 3200ms; }

  @keyframes pulse160 {
    0%, 40%, 100% { opacity: 0; transform: translateY(8px); }
    8%, 32%       { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse240 {
    0%, 45%, 100% { opacity: 0; transform: translateY(8px); }
    10%, 35%      { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse480 {
    0%, 55%, 100% { opacity: 0; transform: translateY(8px); }
    15%, 40%      { opacity: 1; transform: translateY(0); }
  }

  .foot {
    display: flex; gap: 12px; align-items: center;
    font-family: var(--ltx-font-sans); font-size: 12px; font-weight: 300; color: #A9B5B5;
  }
  .foot code { font-family: var(--ltx-font-mono); color: #BCFFB7; background: rgba(188,255,183,0.08); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="row">
  <div class="cell">
    <span class="name">dur-sm</span>
    <span class="val">160ms</span>
    <span class="use">Buttons, links, hover states.</span>
    <div class="stage"><span class="chip c1">hover</span></div>
  </div>
  <div class="cell">
    <span class="name">dur-md</span>
    <span class="val">240ms</span>
    <span class="use">Menus, accordions, tab switches.</span>
    <div class="stage"><span class="chip c2">expand</span></div>
  </div>
  <div class="cell">
    <span class="name">dur-lg</span>
    <span class="val">480ms</span>
    <span class="use">Section reveal on scroll, modal enter.</span>
    <div class="stage"><span class="chip c3">reveal</span></div>
  </div>
</div>
<div class="foot">Easing padrão: <code>cubic-bezier(0.22, 1, 0.36, 1)</code> — out-expo. Sempre fade + até 8px de translate. Nada de scale, rotate, bounce.</div>
</body>
</html>
