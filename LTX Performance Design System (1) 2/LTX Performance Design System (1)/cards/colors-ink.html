<!-- @dsCard group="Colors" viewport="700x130" name="Ink — text neutrals" subtitle="From Branco Gelo to Cinza Sage" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 12px; height: 88px; }
  .sw {
    flex: 1;
    background: #11161B;
    border: 1px solid var(--ltx-border-soft);
    border-radius: var(--ltx-radius-md);
    padding: 12px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: var(--ltx-font-mono);
  }
  .sw .n { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; }
  .sw .h { font-size: 14px; font-weight: 700; }
  .sw .role { font-family: var(--ltx-font-sans); font-size: 11px; font-weight: 400; opacity: 0.7; }
  .ink-100 { color: #EDEEF4; }
  .ink-200 { color: #A9B5B5; }
  .ink-400 { color: #696F6D; }
</style>
</head>
<body>
<div class="row">
  <div class="sw ink-100"><span class="n">BRANCO GELO</span><span class="h">#EDEEF4</span><span class="role">titles</span></div>
  <div class="sw ink-200"><span class="n">CINZA FRIO CLARO</span><span class="h">#A9B5B5</span><span class="role">body</span></div>
  <div class="sw ink-400"><span class="n">CINZA SAGE</span><span class="h">#696F6D</span><span class="role">muted</span></div>
</div>
</body>
</html>
