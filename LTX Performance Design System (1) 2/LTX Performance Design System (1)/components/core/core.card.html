<!-- @dsCard group="Components" viewport="900x480" name="Core primitives" subtitle="Button · Card · Input · Stat · FeatureChip" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 28px; background: #11161B; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  .label { font-family: var(--ltx-font-mono); font-size: 10px; letter-spacing: 0.06em; color: #696F6D; text-transform: uppercase; margin-bottom: 10px; display: block; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .ico { width: 18px; height: 18px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const ns = Object.keys(window).find(k => k.startsWith('LTXPerformanceDesignSystem_'));
  const DS = window[ns];
  const { Button, Card, CardHeader, CardTitle, CardBody, Input, Stat, FeatureChip } = DS;

  // Tiny Lucide-style icons
  const ArrowRight = (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
    </svg>
  );
  const Workflow = (p) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" {...p}>
      <rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/>
      <path d="M9 6h6a3 3 0 0 1 3 3v6"/>
    </svg>
  );

  function Demo() {
    return (
      <div className="grid">
        {/* Buttons */}
        <div className="col">
          <div>
            <span className="label">BUTTON · variants</span>
            <div className="row">
              <Button leadingIcon={<ArrowRight className="ico"/>}>Analisar minha operação</Button>
              <Button variant="secondary">Ver metodologia</Button>
              <Button variant="ghost">Saiba mais</Button>
            </div>
          </div>
          <div>
            <span className="label">BUTTON · sizes</span>
            <div className="row">
              <Button size="sm">Pequeno</Button>
              <Button size="md">Médio</Button>
              <Button size="lg">Marketing</Button>
              <Button disabled>Desabilitado</Button>
            </div>
          </div>
          <div>
            <span className="label">FEATURE CHIP</span>
            <div className="row">
              <FeatureChip icon={<Workflow/>} size="sm"/>
              <FeatureChip icon={<Workflow/>} size="md"/>
              <FeatureChip icon={<Workflow/>} size="lg"/>
              <FeatureChip icon={<Workflow/>} tone="accent"/>
            </div>
          </div>
        </div>

        {/* Right column */}
        <div className="col">
          <div>
            <span className="label">CARD</span>
            <Card padding="lg">
              <CardHeader>
                <CardTitle>Pipeline coordenado</CardTitle>
              </CardHeader>
              <CardBody>Seus canais de leads e automações integrados direto ao CRM.</CardBody>
            </Card>
          </div>
          <div>
            <span className="label">STAT</span>
            <Stat value="34%" label="redução de CAC em 8 semanas"/>
          </div>
          <div>
            <span className="label">INPUT · default + error</span>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <Input label="E-mail corporativo" placeholder="voce@empresa.com.br" hint="Resposta em até 24h por um sócio." required/>
              <Input label="Site da empresa" placeholder="empresa.com.br" error="Domínio inválido"/>
            </div>
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
