<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; background: #11161B; }
  .row { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: center; }
  .frame {
    aspect-ratio: 16 / 9;
    border-radius: 8px;
    overflow: hidden;
    background: #BCFFB7;
  }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .copy {
    font-family: var(--ltx-font-sans);
    font-size: 13px;
    line-height: 1.55;
    color: #A9B5B5;
  }
  .copy h3 {
    font-family: var(--ltx-font-mono);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #EDEEF4;
    margin: 0 0 10px;
  }
  .copy ul { margin: 6px 0 0; padding-left: 18px; }
  .copy li { margin: 2px 0; }
</style>
</head>
<body>
<div class="row">
  <div class="frame"><img src="../assets/images/sample02.png" alt="Silhueta com fundo Verde Neon"></div>
  <div class="copy">
    <h3>Silhueta + Verde Neon</h3>
    <p>Retratos pretos sobre fundo <b style="color:#BCFFB7">#BCFFB7</b>. Sem rosto reconhecível, sem brand-recall específico, mas claramente humano.</p>
    <ul>
      <li>Hero da home e capas de seção</li>
      <li>Carrosséis no LinkedIn e Instagram</li>
      <li>Slide de quebra em propostas</li>
    </ul>
  </div>
</div>
</body>
</html>
