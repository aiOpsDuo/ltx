<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; background: #11161B; }
  .row { display: flex; gap: 24px; align-items: center; }
  .swatch { width: 110px; height: 110px; background: #11161B; border: 1px solid #3B403F;
    display: flex; align-items: center; justify-content: center; border-radius: 0; }
  .swatch img { height: 56px; }
  .note { color: #A9B5B5; font-family: var(--ltx-font-sans); font-size: 13px; line-height: 1.55; max-width: 320px; }
  .note b { color: #EDEEF4; font-family: var(--ltx-font-mono); font-weight: 700; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="row">
  <div class="swatch"><img src="../assets/logo/mark.svg" alt="LTX mark"></div>
  <div class="swatch" style="background:#BCFFB7; border-color:transparent;"><img src="../assets/logo/favicon.svg" alt="favicon" style="height: 64px;"></div>
  <div class="note"><b>Construção</b>The right limb of the X splits into two — Leonardo + Tiago. Always flat, never rotated, never glassed.</div>
</div>
</body>
</html>
