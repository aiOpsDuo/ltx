<!-- @dsCard group="Colors" viewport="700x130" name="Canvas — Preto Profundo" subtitle="#11161B — the marketing canvas" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 16px; height: 88px; }
  .sw {
    width: 220px;
    border-radius: var(--ltx-radius-md);
    padding: 12px 16px;
    display: flex; flex-direction: column; justify-content: space-between;
    font-family: var(--ltx-font-mono);
    border: 1px solid var(--ltx-border-soft);
  }
  .sw .n { font-size: 11px; font-weight: 700; opacity: 0.7; }
  .sw .h { font-size: 18px; font-weight: 700; }
  .paper   { background: #11161B; color: #EDEEF4; }
  .surface { background: #1A1F26; color: #EDEEF4; }
  .line    { background: #3B403F; color: #EDEEF4; }
</style>
</head>
<body>
<div class="row">
  <div class="sw paper"><span class="n">PAPER</span><span class="h">#11161B</span></div>
  <div class="sw surface"><span class="n">SURFACE</span><span class="h">#1A1F26</span></div>
  <div class="sw line"><span class="n">LINE</span><span class="h">#3B403F</span></div>
</div>
</body>
</html>
