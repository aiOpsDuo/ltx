<!-- @dsCard group="Type" viewport="700x170" name="Overline · caption · code" subtitle="Mono accessories, thin by default" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; background: #11161B; display: flex; flex-direction: column; gap: 14px; }
  .overline { font-family: var(--ltx-font-mono); font-weight: 400; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #BCFFB7; }
  .caption { font-family: var(--ltx-font-sans); font-size: 12px; font-weight: 400; color: #A9B5B5; }
  .code-row { display: flex; align-items: center; gap: 8px; }
  .code { font-family: var(--ltx-font-mono); font-size: 14px; font-weight: 400; color: #BCFFB7; background: #1A1F26; padding: 4px 8px; border-radius: 4px; }
  .label { font-family: var(--ltx-font-mono); font-size: 11px; font-weight: 400; color: #696F6D; letter-spacing: 0.06em; text-transform: uppercase; }
</style>
</head>
<body>
  <div><span class="label">Overline / kicker</span><div class="overline">lógica em movimento</div></div>
  <div><span class="label">Caption</span><div class="caption">Última atualização há 3 minutos</div></div>
  <div><span class="label">Code</span><div class="code-row"><code class="code">flow.trigger("lead.created")</code></div></div>
</body>
</html>
