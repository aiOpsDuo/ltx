<!-- @dsCard group="Brand" viewport="700x200" name="Logo · dark + light + mono" subtitle="Three lockups, three canvases" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 0; margin: 0; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr 1fr; height: 176px; }
  .pane { display: flex; align-items: center; justify-content: center; padding: 18px; position: relative; }
  .pane img { height: 28px; width: auto; }
  .pane .tag {
    position: absolute; bottom: 10px; left: 14px;
    font-family: var(--ltx-font-mono); font-size: 10px;
    letter-spacing: 0.06em; color: #696F6D;
  }
  .dark   { background: #11161B; }
  .light  { background: #FFFFFF; }
  .mono   { background: #EDEEF4; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pane dark">
    <img src="../assets/logo/lockup-horizontal.svg" alt="LTX on dark">
    <span class="tag">DARK · #BCFFB7</span>
  </div>
  <div class="pane light">
    <img src="../assets/logo/lockup-horizontal-light.svg" alt="LTX on light">
    <span class="tag">LIGHT · #1F9E17</span>
  </div>
  <div class="pane mono">
    <img src="../assets/logo/wordmark.svg" alt="LTX mono">
    <span class="tag">MONO · single ink</span>
  </div>
</div>
</body>
</html>
