<!-- @dsCard group="Spacing" viewport="700x150" name="4px scale" subtitle="space-1 → space-12 — the rhythm of every layout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px; background: #11161B; }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: #BCFFB7; border-radius: 2px; width: 24px; }
  .lbl { font-family: var(--ltx-font-mono); font-size: 10px; color: #A9B5B5; letter-spacing: 0.04em; }
  .px { font-family: var(--ltx-font-mono); font-size: 10px; color: #696F6D; }
</style>
</head>
<body>
<div class="row">
  <div class="col"><div class="bar" style="height:4px"></div><span class="lbl">1</span><span class="px">4</span></div>
  <div class="col"><div class="bar" style="height:8px"></div><span class="lbl">2</span><span class="px">8</span></div>
  <div class="col"><div class="bar" style="height:12px"></div><span class="lbl">3</span><span class="px">12</span></div>
  <div class="col"><div class="bar" style="height:16px"></div><span class="lbl">4</span><span class="px">16</span></div>
  <div class="col"><div class="bar" style="height:24px"></div><span class="lbl">6</span><span class="px">24</span></div>
  <div class="col"><div class="bar" style="height:32px"></div><span class="lbl">8</span><span class="px">32</span></div>
  <div class="col"><div class="bar" style="height:48px"></div><span class="lbl">12</span><span class="px">48</span></div>
  <div class="col"><div class="bar" style="height:64px"></div><span class="lbl">16</span><span class="px">64</span></div>
  <div class="col"><div class="bar" style="height:96px"></div><span class="lbl">24</span><span class="px">96</span></div>
</div>
</body>
</html>
